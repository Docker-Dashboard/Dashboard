name: Verify Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false # Ensures it only tests the build without uploading it anywhere
          tags: dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max